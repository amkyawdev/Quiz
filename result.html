<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results - QuizMaster 3D</title>
  <meta name="description" content="QuizMaster 3D - View your quiz results!">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <!-- Navbar -->
  <div id="navbar-container"></div>

  <!-- Results Container -->
  <main class="result-container">
    <div class="result-card">
      <!-- Result Icon -->
      <div class="result-icon" id="result-icon">🏆</div>
      
      <!-- Rating -->
      <h1 class="result-rating" id="rating-text">Great Job!</h1>
      
      <!-- Score Display -->
      <div class="result-score" id="score-value">0</div>
      <div class="result-xp" id="xp-value">+0 XP</div>
      
      <!-- Stats Grid -->
      <div class="result-stats">
        <div class="result-stat">
          <div class="result-stat-value" id="correct-count">0</div>
          <div class="result-stat-label">Correct Answers</div>
        </div>
        
        <div class="result-stat">
          <div class="result-stat-value" id="total-count">0</div>
          <div class="result-stat-label">Total Questions</div>
        </div>
        
        <div class="result-stat">
          <div class="result-stat-value" id="percentage-value">0%</div>
          <div class="result-stat-label">Accuracy</div>
        </div>
        
        <div class="result-stat">
          <div class="result-stat-value" id="streak-value">0</div>
          <div class="result-stat-label">Best Streak</div>
        </div>
      </div>
      
      <!-- Action Buttons -->
      <div class="result-buttons">
        <button id="play-again-btn" class="btn btn-primary">
          <span>🎮</span>
          <span>Play Again</span>
        </button>
        
        <button id="home-btn" class="btn btn-secondary">
          <span>🏠</span>
          <span>Home</span>
        </button>
        
        <button id="profile-btn" class="btn btn-secondary">
          <span>👤</span>
          <span>Profile</span>
        </button>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="./assets/js/app.js"></script>
</body>
</html>
